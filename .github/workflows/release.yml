name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.62)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify tag matches package.json
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $expected = $tag.TrimStart('v')
          $actual = (Get-Content package.json | ConvertFrom-Json).version
          if ($expected -ne $actual) { throw "Tag $tag does not match package.json version $actual" }
          Write-Host "Releasing $tag"
      - run: npm test
      - run: node scripts/check-version-consistency.js
      - run: node -e "const r=require('./src/harness_lint').lint(); if(!r.ok) process.exit(1)"
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          .\packaging\build.ps1 -Installer
      - name: Upload installer + checksum
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/*.sha256

  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/tauri -> target
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Tauri Windows bundles
        working-directory: packaging/tauri
        run: cargo tauri build
      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri
          path: |
            packaging/tauri/target/release/bundle/msi/*.msi
            packaging/tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    needs: [build, tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: tauri
          path: dist/tauri/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/**/*
          generate_release_notes: true
          draft: false
