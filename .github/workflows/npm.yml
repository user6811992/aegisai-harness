name: npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tag matches package.json
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(node -p "require('./package.json').version")"
      - run: npm test
      - run: node scripts/check-version-consistency.js
      - run: node -e "const r=require('./src/harness_lint').lint(); if(!r.ok) process.exit(1)"
      - run: npm publish --access public
        # Trusted publishing (OIDC) — no NPM_TOKEN needed.
        # npm authenticates via the OIDC token from GitHub Actions.
