name: submodule-bump

# Weekly upstream bump automation — clean-room adaptation of
# replikeit/ik-llama-cpp-rs workflow. Keeps vendor/aegis current.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check submodule updates
        id: check
        run: |
          git submodule update --remote vendor/aegis
          if git diff --quiet -- vendor/aegis; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "vendor/aegis is already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commit available:"
            git -C vendor/aegis log -1 --oneline
          fi
      - name: Build test
        if: steps.check.outputs.changed == 'true'
        run: node tests/run-tests.js > /dev/null
      - name: Create PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/submodule-bump
          title: 'chore: bump vendor/aegis method pack'
          body: |
            Automated weekly submodule bump for `vendor/aegis`.
            Generated by `.github/workflows/submodule-bump.yml`.
            Full test suite passed on the runner before this PR was opened.
          commit-message: 'chore: bump vendor/aegis submodule'
