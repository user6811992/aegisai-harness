services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
  harness:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - BACKEND_TYPE=ollama
      - BACKEND_URL=http://ollama:11434
    volumes:
      - harness:/app/data
    depends_on:
      - ollama
volumes:
  ollama:
  harness:
