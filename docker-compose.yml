services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
  harness:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - HOST=127.0.0.1
      - BACKEND_TYPE=ollama
      - BACKEND_URL=http://ollama:11434
      - AEGISAI_TOKEN=${AEGISAI_TOKEN:-}
    volumes:
      - harness:/app/data
    depends_on:
      - ollama
volumes:
  ollama:
  harness:
